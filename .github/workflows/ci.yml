name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build Web Cockpit
      working-directory: web
      run: |
        npm ci
        npm run build

    - name: Build Widget
      working-directory: widget
      run: |
        npm ci
        npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Run Go Tests
      run: go test -v ./...

    - name: Build Go Binary
      run: go build -v ./cmd/uploadgate

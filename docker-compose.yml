services:
  uploadgate:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - UPLOADGATE_SERVER_PORT=8080
      - UPLOADGATE_STORAGE_DEFAULT_PROVIDER=minio
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_ENDPOINT=http://minio:9000
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_BUCKET=uploadgate
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_ACCESS_KEY_ID=minioadmin
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_SECRET_ACCESS_KEY=minioadmin
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_USE_PATH_STYLE=true
      - UPLOADGATE_STORAGE_PROVIDERS_MINIO_PUBLIC_BASE_URL=http://localhost:9000/uploadgate
    depends_on:
      - minio
    volumes:
      - uploadgate-data:/app/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

volumes:
  uploadgate-data:
  minio-data:
